<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310" role="img" aria-labelledby="title desc">
<title id="title">Spot interface: local demonstration flow</title><desc id="desc">Conceptual demonstration, with no account or transaction data.</desc>
<rect width="1040" height="310" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34536b"/></marker></defs>
<g font-family="system-ui, sans-serif" font-size="17" fill="#172b3a"><text x="24" y="37" font-weight="600">Spot interface: local demonstration flow</text><rect x="20" y="100" width="160" height="74" rx="10" fill="#f4f7fa" stroke="#8293a7"/><text x="100.0" y="127.0" text-anchor="middle" dominant-baseline="middle">Select demo</text><text x="100.0" y="147.0" text-anchor="middle" dominant-baseline="middle">wallet</text><rect x="230" y="100" width="160" height="74" rx="10" fill="#f4f7fa" stroke="#8293a7"/><text x="310.0" y="137.0" text-anchor="middle" dominant-baseline="middle">Enter an order</text><rect x="440" y="100" width="160" height="74" rx="10" fill="#f4f7fa" stroke="#8293a7"/><text x="520.0" y="127.0" text-anchor="middle" dominant-baseline="middle">Review</text><text x="520.0" y="147.0" text-anchor="middle" dominant-baseline="middle">confirmation</text><rect x="650" y="100" width="160" height="74" rx="10" fill="#f4f7fa" stroke="#8293a7"/><text x="730.0" y="127.0" text-anchor="middle" dominant-baseline="middle">Update local order</text><text x="730.0" y="147.0" text-anchor="middle" dominant-baseline="middle">and balance</text><rect x="860" y="100" width="160" height="74" rx="10" fill="#f4f7fa" stroke="#8293a7"/><text x="940.0" y="127.0" text-anchor="middle" dominant-baseline="middle">Cancel an</text><text x="940.0" y="147.0" text-anchor="middle" dominant-baseline="middle">open order</text><path d="M 180 137 L 230 137" fill="none" stroke="#34536b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 390 137 L 440 137" fill="none" stroke="#34536b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 600 137 L 650 137" fill="none" stroke="#34536b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 810 137 L 860 137" fill="none" stroke="#34536b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 940 174 L 940 245 L 730 245 L 730 174" fill="none" stroke="#34536b" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="287" font-size="15">Simulated state only. No real transactions are sent.</text></g>
</svg>
